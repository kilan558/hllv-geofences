name: Feature request
description: Propose an improvement within the standalone Vietnam-only scope.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The public project intentionally remains Vietnam-only, Warfare-only,
        standalone, and free of CRCON, Master Cache, Docker socket, and seeding
        dependencies.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or player problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the configuration and observable runtime behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain any operational workaround already available.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This preserves the standalone Vietnam-only Warfare boundary.
          required: true
        - label: This request contains no credentials or private server/player data.
          required: true
